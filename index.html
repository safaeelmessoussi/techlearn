<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iTraining — Practical Tech Skills</title>
<meta name="description" content="Free, hands-on training programs in hardware, software, networking, cybersecurity and cloud computing.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230f766e'/><text x='32' y='44' font-size='34' text-anchor='middle' fill='white' font-family='Arial' font-weight='700'>i</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f8fa;--surface:#fff;--surface-2:#f1f3f6;--text:#0f172a;--muted:#5b6475;--line:#e3e7ee;
  --brand:#0f766e;--brand-2:#14b8a6;--brand-ink:#fff;--warn:#b45309;--ok:#15803d;
  --fd:#b45309;--hw:#c2410c;--sw:#4f46e5;--net:#0369a1;--sec:#be123c;--cloud:#7c3aed;
  --radius:14px;--shadow:0 1px 2px rgba(15,23,42,.05),0 4px 16px rgba(15,23,42,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1020;--surface:#121a2e;--surface-2:#18213a;--text:#e6ebf5;--muted:#9aa5bd;--line:#243051;
  --brand:#2dd4bf;--brand-2:#5eead4;--brand-ink:#04201d;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  --fd:#fbbf24;--hw:#fb923c;--sw:#818cf8;--net:#38bdf8;--sec:#fb7185;--cloud:#a78bfa;}}
:root[data-theme="dark"]{
  --bg:#0b1020;--surface:#121a2e;--surface-2:#18213a;--text:#e6ebf5;--muted:#9aa5bd;--line:#243051;
  --brand:#2dd4bf;--brand-2:#5eead4;--brand-ink:#04201d;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  --fd:#fbbf24;--hw:#fb923c;--sw:#818cf8;--net:#38bdf8;--sec:#fb7185;--cloud:#a78bfa;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.6 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;cursor:pointer}
code,.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.88em}
.wrap{max-width:1160px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:16px;height:62px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;text-decoration:none;font-size:1.15rem;letter-spacing:-.02em}
.logo span.mark{width:32px;height:32px;border-radius:9px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:800}
.nav .links{display:flex;gap:4px;margin-left:auto}
.nav .links a{text-decoration:none;color:var(--muted);padding:8px 12px;border-radius:8px;font-weight:500;font-size:.95rem}
.nav .links a:hover,.nav .links a.on{color:var(--text);background:var(--surface-2)}
.iconbtn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:9px;width:38px;height:38px;display:grid;place-items:center}
@media(max-width:640px){.nav .links a.hide-sm{display:none}}

.hero{padding:64px 0 40px}
.hero h1{font-size:clamp(2rem,5vw,3.4rem);line-height:1.08;letter-spacing:-.035em;margin:0 0 16px;max-width:820px}
.hero h1 em{font-style:normal;color:var(--brand)}
.hero p.lead{font-size:1.15rem;color:var(--muted);max-width:640px;margin:0 0 28px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:10px;padding:11px 18px;font-weight:600;border:1px solid transparent;text-decoration:none}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn.ghost{border-color:var(--line);background:var(--surface)}
.btn.sm{padding:7px 12px;font-size:.9rem}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:40px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.stat b{display:block;font-size:1.6rem;letter-spacing:-.02em}
.stat span{color:var(--muted);font-size:.9rem}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}

section.block{padding:32px 0}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.sec-head h2{margin:0;font-size:1.6rem;letter-spacing:-.02em}
.sec-head p{margin:4px 0 0;color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.search{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:9px 12px;min-width:220px;font:inherit}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:.88rem;font-weight:500}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
@media(max-width:380px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:12px;text-decoration:none;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:var(--accent,var(--brand))}
.card .ic{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.card h3{margin:0;font-size:1.2rem;letter-spacing:-.01em}
.card p{margin:0;color:var(--muted);font-size:.95rem}
.meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:.85rem}
.meta span{display:inline-flex;align-items:center;gap:5px}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent,var(--brand));border-radius:99px;transition:width .3s}
.card.start{border-width:2px;border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.tag.start-tag{background:color-mix(in srgb,var(--fd) 16%,transparent);color:var(--fd)}
.tag{display:inline-block;font-size:.75rem;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted)}

.paths{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.path{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.path h4{margin:0 0 6px;font-size:1.05rem}
.path p{margin:0 0 12px;color:var(--muted);font-size:.92rem}
.path ol{margin:0;padding-left:20px;font-size:.92rem}
.path li{margin:3px 0}

/* track page */
.crumb{color:var(--muted);font-size:.9rem;padding-top:24px}
.crumb a{text-decoration:none;color:var(--muted)}
.crumb a:hover{color:var(--text)}
.thead{display:grid;grid-template-columns:1fr 300px;gap:24px;padding:20px 0 8px;align-items:start}
@media(max-width:860px){.thead{grid-template-columns:1fr}}
.thead h1{margin:8px 0 10px;font-size:clamp(1.8rem,4vw,2.6rem);letter-spacing:-.03em;line-height:1.1}
.thead .desc{color:var(--muted);font-size:1.05rem;margin:0 0 14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.panel h5{margin:0 0 10px;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.panel ul{margin:0;padding-left:18px;font-size:.93rem}
.panel ul li{margin:4px 0}
.progress-big{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.progress-big b{font-size:2rem;letter-spacing:-.03em}

.modules{display:flex;flex-direction:column;gap:12px;padding:16px 0 40px}
.mod{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.mod>summary{list-style:none;display:flex;align-items:center;gap:14px;padding:16px 18px;cursor:pointer}
.mod>summary::-webkit-details-marker{display:none}
.mod .num{width:34px;height:34px;flex:none;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.mod.done .num{background:var(--accent);color:#fff}
.mod .mt{flex:1;min-width:0}
.mod .mt b{display:block;font-size:1.02rem}
.mod .mt small{color:var(--muted)}
.mod .chev{transition:transform .2s;color:var(--muted)}
.mod[open] .chev{transform:rotate(180deg)}
.mod .body{padding:0 18px 18px 66px;display:grid;gap:16px}
@media(max-width:600px){.mod .body{padding:0 16px 16px}}
.mod h6{margin:0 0 6px;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.mod ul{margin:0;padding-left:18px}
.lab{border:1px dashed var(--line);background:var(--surface-2);border-radius:10px;padding:14px}
.lab b{display:flex;align-items:center;gap:8px}
.lab ol{margin:8px 0 0;padding-left:20px}
.lab pre{margin:10px 0 0;background:#0b1020;color:#d7e3ff;border-radius:8px;padding:12px;overflow:auto;font-size:.82rem}
.quiz{border:1px solid var(--line);border-radius:10px;padding:14px}
.quiz .q{font-weight:600;margin-bottom:8px}
.quiz .opts{display:grid;gap:6px}
.quiz .opts button{text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:8px;padding:8px 12px}
.quiz .opts button.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.quiz .opts button.wrong{border-color:var(--sec);background:color-mix(in srgb,var(--sec) 10%,transparent)}
.quiz .fb{margin-top:8px;font-size:.9rem;color:var(--muted)}
.mod-actions{display:flex;gap:8px;flex-wrap:wrap}

.cert{text-align:center;padding:28px;border:2px solid var(--accent);border-radius:var(--radius);background:var(--surface);margin-bottom:40px}
.cert h3{margin:0 0 6px}
.dash-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}

footer{border-top:1px solid var(--line);padding:28px 0;color:var(--muted);font-size:.9rem;margin-top:24px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.empty{color:var(--muted);padding:24px;text-align:center;border:1px dashed var(--line);border-radius:var(--radius)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

 {t:'IT Support Technician',d:'Entry-level role fixing devices and helping users.',steps:['foundations','hardware','networking','cybersecurity (modules 1–3)']},
 {t:'Network Administrator',d:'Run and secure an organization\'s network.',steps:['foundations','hardware','networking','cybersecurity','cloud (modules 1–3)']},
 {t:'Junior Developer',d:'Build and ship web applications and APIs.',steps:['foundations','software','cloud (modules 4–6)','cybersecurity (modules 2–3)']},
 {t:'SOC Analyst',d:'Monitor, detect and respond to threats.',steps:['foundations','networking','cybersecurity','cloud (modules 1, 3)']},
 {t:'Cloud / DevOps Engineer',d:'Automate infrastructure and delivery pipelines.',steps:['foundations','software','networking','cloud','cybersecurity (modules 3–4)']}
];

/* ---------- STATE ---------- */
const KEY='itraining.progress.v1';
let progress={};
try{progress=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){progress={}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(progress))}catch(e){}};
const done=(tid,i)=>!!(progress[tid]&&progress[tid][i]);
const pct=t=>t.page?Math.min(100,Math.round(100*Object.keys(progress[t.id]||{}).length/t.chapters)):Math.round(100*t.modules.filter((_,i)=>done(t.id,i)).length/t.modules.length);
const accent=t=>`var(--${t.key})`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- VIEWS ---------- */
const app=document.getElementById('app');
let filter={q:'',lvl:'All'};

function trackCard(t){
 const p=pct(t);
 return `<a class="card${t.start?' start':''}" href="${t.page||'#/track/'+t.id}" style="--accent:${accent(t)}">
  <div class="ic">${ICON[t.key]}</div>
  <h3>${esc(t.title)}</h3>
  <p>${esc(t.summary)}</p>
  <div class="meta">${t.page?`<span>${ICON.book}${t.chapters} interactive chapters</span><span>${ICON.flask}Live simulations</span>`:`<span>${ICON.clock}${t.weeks} weeks</span><span>${ICON.book}${t.modules.length} modules</span><span>${ICON.flask}${t.modules.length} labs</span>`}</div>
  <div><span class="tag">${esc(t.level)}</span>${t.start?' <span class="tag start-tag">Start here</span>':''}</div>
  <div class="bar" aria-label="${p}% complete"><i style="width:${p}%"></i></div>
 </a>`;
}

function home(){
 const total=TRACKS.reduce((a,t)=>a+(t.page?t.chapters:t.modules.length),0);
 const hours=TRACKS.reduce((a,t)=>a+t.weeks,0)*6;
 app.innerHTML=`
 <section class="hero"><div class="wrap">
  <h1>Practical tech skills, <em>learned by doing.</em></h1>
  <p class="lead">Free training programs in hardware, software, networking, cybersecurity and cloud — each module ends in a hands-on lab and a quick check.</p>
  <div class="cta"><a class="btn primary" href="#programs">Browse programs</a><a class="btn ghost" href="#/paths">Pick a career path</a></div>
  <div class="stats">
   <div class="stat"><b>${TRACKS.length}</b><span>Programs</span></div>
   <div class="stat"><b>${total}</b><span>Modules</span></div>
   <div class="stat"><b>${total}</b><span>Hands-on labs</span></div>
   <div class="stat"><b>~${hours}h</b><span>Of guided learning</span></div>
  </div>
 </div></section>
 <section class="block" id="programs"><div class="wrap">
  <div class="sec-head">
   <div><h2>Programs</h2><p>Start anywhere — each program is self-contained.</p></div>
   <div class="filters">
    <label class="sr" for="q">Search</label>
    <input id="q" class="search" placeholder="Search topics, tools, certs…" value="${esc(filter.q)}">
    ${['All','Beginner','Intermediate'].map(l=>`<button class="chip ${filter.lvl===l?'on':''}" data-lvl="${l}">${l}</button>`).join('')}
   </div>
  </div>
  <div class="grid" id="grid"></div>
 </div></section>`;
 const draw=()=>{
  const q=filter.q.toLowerCase();
  const list=TRACKS.filter(t=>(filter.lvl==='All'||t.level.includes(filter.lvl))&&
   (!q||JSON.stringify(t).toLowerCase().includes(q)));
  document.getElementById('grid').innerHTML=list.length?list.map(trackCard).join(''):'<div class="empty">No program matches that search.</div>';
 };
 draw();
 document.getElementById('q').addEventListener('input',e=>{filter.q=e.target.value;draw()});
 app.querySelectorAll('[data-lvl]').forEach(b=>b.onclick=()=>{filter.lvl=b.dataset.lvl;app.querySelectorAll('[data-lvl]').forEach(x=>x.classList.toggle('on',x===b));draw()});
}

function track(id){
 const t=TRACKS.find(x=>x.id===id);
 if(!t){app.innerHTML='<div class="wrap"><p class="empty" style="margin:40px 0">Program not found. <a href="#/">Back to programs</a></p></div>';return}
 const p=pct(t);
 app.innerHTML=`<div class="wrap" style="--accent:${accent(t)}">
  <div class="crumb"><a href="#/">Programs</a> / ${esc(t.title)}</div>
  <div class="thead">
   <div>
    <span class="tag">${esc(t.level)} · ${t.weeks} weeks · ~6 h/week</span>
    <h1>${esc(t.title)}</h1>
    <p class="desc">${esc(t.summary)}</p>
    <div class="panel"><h5>You will be able to</h5><ul>${t.outcomes.map(o=>`<li>${esc(o)}</li>`).join('')}</ul></div>
   </div>
   <aside class="panel">
    <h5>Your progress</h5>
    <div class="progress-big"><b id="pp">${p}%</b><span style="color:var(--muted)">complete</span></div>
    <div class="bar"><i id="pb" style="width:${p}%"></i></div>
    <h5 style="margin-top:18px">Prepares for</h5><ul>${t.certs.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>
    <h5 style="margin-top:18px">Tools you'll use</h5><ul>${t.tools.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>
   </aside>
  </div>
  <div class="modules">${t.modules.map((m,i)=>moduleHTML(t,m,i)).join('')}</div>
  <div id="certBox"></div>
 </div>`;
 bindModules(t);
 certBox(t);
}

function moduleHTML(t,m,i){
 const d=done(t.id,i);
 return `<details class="mod ${d?'done':''}" data-i="${i}" ${i===0&&!d?'open':''}>
  <summary><span class="num">${d?'✓':i+1}</span><span class="mt"><b>${esc(m.t)}</b><small>${esc(m.d)}</small></span>${ICON.chev}</summary>
  <div class="body">
   <div><h6>Topics</h6><ul>${m.topics.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
   <div class="lab"><b>${ICON.flask} Lab: ${esc(m.lab.t)}</b><ol>${m.lab.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>${m.lab.code?`<pre><code>${esc(m.lab.code)}</code></pre>`:''}</div>
   <div class="quiz"><div class="q">Check: ${esc(m.quiz.q)}</div><div class="opts">${m.quiz.o.map((o,k)=>`<button data-k="${k}">${esc(o)}</button>`).join('')}</div><div class="fb"></div></div>
   <div class="mod-actions"><button class="btn ${d?'ghost':'primary'} sm" data-toggle>${d?'Mark as not done':'Mark module complete'}</button></div>
  </div>
 </details>`;
}

function bindModules(t){
 app.querySelectorAll('.mod').forEach(el=>{
  const i=+el.dataset.i, m=t.modules[i];
  el.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{
   const k=+b.dataset.k, ok=k===m.quiz.a;
   el.querySelectorAll('.opts button').forEach(x=>x.classList.remove('right','wrong'));
   b.classList.add(ok?'right':'wrong');
   if(!ok) el.querySelector(`.opts button[data-k="${m.quiz.a}"]`).classList.add('right');
   el.querySelector('.fb').textContent=(ok?'Correct. ':'Not quite. ')+m.quiz.e;
  });
  el.querySelector('[data-toggle]').onclick=()=>{
   progress[t.id]=progress[t.id]||{};
   progress[t.id][i]=!progress[t.id][i]; save();
   const wasOpen=el.open;
   el.outerHTML=moduleHTML(t,m,i);
   const n=app.querySelector(`.mod[data-i="${i}"]`); n.open=wasOpen;
   bindModules(t);
   const p=pct(t); document.getElementById('pp').textContent=p+'%'; document.getElementById('pb').style.width=p+'%';
   certBox(t);
  };
 });
}

function certBox(t){
 const box=document.getElementById('certBox'); if(!box) return;
 box.innerHTML=pct(t)===100?`<div class="cert"><h3>🎓 Program complete</h3><p style="color:var(--muted);margin:0">You've finished every module of <b>${esc(t.title)}</b>. Next step: book the ${esc(t.certs[0])} exam or start another program.</p></div>`:'';
}

function paths(){
 const name=s=>{const id=s.split(' ')[0];const t=TRACKS.find(x=>x.id===id);return t?`<a href="#/track/${t.id}">${esc(t.title)}</a>${esc(s.slice(id.length))}`:esc(s)};
 app.innerHTML=`<section class="block"><div class="wrap">
  <div class="sec-head"><div><h2>Career paths</h2><p>Recommended program order for common entry-level IT roles.</p></div></div>
  <div class="paths">${PATHS.map(p=>`<div class="path"><h4>${esc(p.t)}</h4><p>${esc(p.d)}</p><ol>${p.steps.map(s=>`<li>${name(s)}</li>`).join('')}</ol></div>`).join('')}</div>
 </div></section>`;
}

function dash(){
 const any=TRACKS.some(t=>pct(t)>0);
 app.innerHTML=`<section class="block"><div class="wrap">
  <div class="sec-head"><div><h2>My progress</h2><p>Saved in this browser only.</p></div>
   ${any?'<button class="btn ghost sm" id="reset">Reset progress</button>':''}</div>
  ${any?'':'<div class="empty" style="margin-bottom:16px">You haven\'t completed any modules yet. <a href="#/">Pick a program</a> to begin.</div>'}
  <div class="grid">${TRACKS.map(trackCard).join('')}</div>
 </div></section>`;
 const r=document.getElementById('reset');
 if(r) r.onclick=()=>{if(confirm('Clear all progress?')){progress={};save();dash()}};
}

/* ---------- ROUTER ---------- */
function route(){
 const h=location.hash||'#/';
 if(h==='#programs'){ if(!document.getElementById('programs')) home(); document.getElementById('programs').scrollIntoView({behavior:'smooth'}); return; }
 const [,a,b]=h.split('/');
 document.querySelectorAll('[data-nav]').forEach(x=>x.classList.toggle('on',x.dataset.nav===(a||'home')));
 if(a==='track'){const t=TRACKS.find(x=>x.id===b); if(t&&t.page){location.href=t.page;return} track(b);}
 else if(a==='paths') paths();
 else if(a==='progress') dash();
 else home();
 window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
route();

/* ---------- THEME ---------- */
const themeBtn=document.getElementById('themeBtn');
try{const th=localStorage.getItem('itraining.theme');if(th)document.documentElement.dataset.theme=th}catch(e){}
themeBtn.onclick=()=>{
 const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
 const next=cur==='dark'?'light':'dark';
 document.documentElement.dataset.theme=next;
 try{localStorage.setItem('itraining.theme',next)}catch(e){}
};
document.getElementById('yr').textContent=new Date().getFullYear();
</script>
